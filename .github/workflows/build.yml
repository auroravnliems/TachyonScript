name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compile, test and package
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      # Compiles every module with warnings as errors (the JMH benchmarks included),
      # runs all tests (including the compiled documentation examples and the
      # generated-reference check) and builds the plugin jar.
      - name: Build
        run: ./gradlew build --stacktrace

      - name: Upload plugin jar
        uses: actions/upload-artifact@v7
        with:
          name: TachyonScript-plugin
          path: tachyon-plugin/build/libs/TachyonScript-*.jar
          if-no-files-found: error

      - name: Upload CLI
        uses: actions/upload-artifact@v7
        with:
          name: tys-cli
          path: tachyon-cli/build/distributions/*.zip
          if-no-files-found: error

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: '**/build/reports/tests/'
