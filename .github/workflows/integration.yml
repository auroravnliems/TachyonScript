name: Paper and Folia integration

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: ${{ matrix.server }} 1.21.11
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        server: [paper, folia]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - name: Build production plugin and test probe
        run: ./gradlew :tachyon-plugin:shadowJar :tachyon-integration:jar --stacktrace
      - name: Run isolated server probe
        run: python3 validation/integration/run.py --project ${{ matrix.server }} --accept-eula
      - name: Upload integration evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: integration-${{ matrix.server }}
          path: |
            validation/integration/runs/*/result.json
            validation/integration/runs/*/probe-result.json
            validation/integration/runs/*/server.log
          if-no-files-found: warn
